<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spendradar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">

        <stop offset="0%" stop-color="#ff3333"/>

    </defs>
    <path d="M52 8 C48 12 42 14 40 18 C38 22 40 26 38 30 C36 34 30 36 28 40 C26 44 28 48 30 50 C26 52 22 56 24 60 C26 64 32 66 36 68 C40 70 42 74 44 78 C46 82 48 86 50 88 C52 86 54 82 56 78 C58 74 60 70 64 68 C68 66 74 64 76 60 C78 56 74 52 70 50 C72 48 74 44 72 40 C70 36 64 34 62 30 C60 26 62 22 60 18 C58 14 56 12 52 8Z" stroke="url(#dragonGrad)" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <path d="M40 18 C36 16 30 18 28 22" stroke="url(#dragonGrad)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M60 18 C64 16 70 18 72 22" stroke="url(#dragonGrad)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M28 40 C22 42 18 48 16 52" stroke="url(#dragonGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M72 40 C78 42 82 48 84 52" stroke="url(#dragonGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M36 68 C32 72 26 74 22 76" stroke="url(#dragonGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M64 68 C68 72 74 74 78 76" stroke="url(#dragonGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M44 26 C46 30 50 32 54 30" stroke="url(#dragonGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M42 34 C46 38 54 38 58 34" stroke="url(#dragonGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M40 42 C44 46 56 46 60 42" stroke="url(#dragonGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M42 50 C46 54 54 54 58 50" stroke="url(#dragonGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M44 58 C48 62 52 62 56 58" stroke="url(#dragonGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <circle cx="44" cy="20" r="2" fill="#d61f1f" opacity="0.9"/>
    <circle cx="56" cy="20" r="2" fill="#d61f1f" opacity="0.9"/>
    <circle cx="44" cy="20" r="0.8" fill="#ff6666"/>
    <circle cx="56" cy="20" r="0.8" fill="#ff6666"/>
    <path d="M34 14 C30 10 26 8 22 10" stroke="url(#dragonGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M66 14 C70 10 74 8 78 10" stroke="url(#dragonGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M32 12 C28 6 24 4 20 6" stroke="url(#dragonGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M68 12 C72 6 76 4 80 6" stroke="url(#dragonGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M46 14 L42 8" stroke="url(#dragonGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M54 14 L58 8" stroke="url(#dragonGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M42 8 C40 4 38 2 36 0" stroke="url(#dragonGrad)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    <path d="M58 8 C60 4 62 2 64 0" stroke="url(#dragonGrad)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    <path d="M48 88 C48 92 50 96 52 100" stroke="url(#dragonGrad)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M50 88 C50 94 48 98 46 100" stroke="url(#dragonGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </svg>
  <h1>spendradar</h1>
  <div class="header-actions">
    <button class="btn btn-sm" id="loadSampleBtn">load sample data</button>
    <button class="btn btn-sm" id="exportCsvBtn">export csv</button>
    <button class="btn btn-sm" id="clearAllBtn">clear all data</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="dashboard">dashboard</button>
  <button class="tab" data-tab="subscriptions">subscriptions</button>
  <button class="tab" data-tab="expenses">expenses</button>
  <button class="tab" data-tab="budget">budget</button>
</div>

<div class="panel active" id="dashboard">
  <div class="stats-grid" id="dashStats"></div>
  <div id="alertStrip"></div>
  <div class="section-title">this month's spend by category</div>
  <div class="card" id="categoryChart"></div>
</div>

<div class="panel" id="subscriptions">
  <div class="card">
    <form id="subForm">
      <div class="form-row">
        <div class="form-group">
          <label>name</label>
          <input type="text" id="subName" required>
        </div>
        <div class="form-group">
          <label>price</label>
          <input type="number" id="subPrice" min="0" step="0.01" required>
        </div>
        <div class="form-group">
          <label>cycle</label>
          <select id="subCycle">
            <option value="monthly">monthly</option>
            <option value="weekly">weekly</option>
            <option value="yearly">yearly</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>next renewal date</label>
          <input type="date" id="subRenewal" required>
        </div>
        <div class="form-group">
          <label>category</label>
          <select id="subCategory">
            <option value="entertainment">entertainment</option>
            <option value="productivity">productivity</option>
            <option value="cloud">cloud</option>
            <option value="music">music</option>
            <option value="video">video</option>
            <option value="software">software</option>
            <option value="other">other</option>
          </select>
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <div class="checkbox-row">
            <input type="checkbox" id="subTrial">
            <label for="subTrial">free trial</label>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" style="flex:3">
          <label>note</label>
          <input type="text" id="subNote" placeholder="optional">
        </div>
        <div class="form-group" style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button type="submit" class="btn btn-accent" id="subSaveBtn">add subscription</button>
        </div>
      </div>
      <input type="hidden" id="subEditId" value="">
    </form>
  </div>
  <div class="filter-bar">
    <input type="text" id="subSearch" placeholder="search subscriptions...">
    <select id="subFilterCat">
      <option value="">all categories</option>
      <option value="entertainment">entertainment</option>
      <option value="productivity">productivity</option>
      <option value="cloud">cloud</option>
      <option value="music">music</option>
      <option value="video">video</option>
      <option value="software">software</option>
      <option value="other">other</option>
    </select>
  </div>
  <div id="subList"></div>
</div>

<div class="panel" id="expenses">
  <div class="card">
    <form id="expForm">
      <div class="form-row">
        <div class="form-group">
          <label>title</label>
          <input type="text" id="expTitle" required>
        </div>
        <div class="form-group">
          <label>amount</label>
          <input type="number" id="expAmount" min="0" step="0.01" required>
        </div>
        <div class="form-group">
          <label>date</label>
          <input type="date" id="expDate" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>category</label>
          <select id="expCategory">
            <option value="food">food</option>
            <option value="transport">transport</option>
            <option value="shopping">shopping</option>
            <option value="bills">bills</option>
            <option value="health">health</option>
            <option value="other">other</option>
          </select>
        </div>
        <div class="form-group">
          <label>method</label>
          <select id="expMethod">
            <option value="upi">upi</option>
            <option value="cash">cash</option>
            <option value="card">card</option>
            <option value="other">other</option>
          </select>
        </div>
        <div class="form-group">
          <label>note</label>
          <input type="text" id="expNote" placeholder="optional">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" style="flex:1"></div>
        <div class="form-group" style="flex:0 0 auto">
          <button type="submit" class="btn btn-accent" id="expSaveBtn">add expense</button>
        </div>
      </div>
      <input type="hidden" id="expEditId" value="">
    </form>
  </div>
  <div class="filter-bar">
    <input type="text" id="expSearch" placeholder="search expenses...">
    <select id="expFilterCat">
      <option value="">all categories</option>
      <option value="food">food</option>
      <option value="transport">transport</option>
      <option value="shopping">shopping</option>
      <option value="bills">bills</option>
      <option value="health">health</option>
      <option value="other">other</option>
    </select>
    <button class="btn btn-sm" id="expSortBtn">sort: newest</button>
  </div>
  <div class="chips" id="expChips">
    <button class="chip" data-chip="today">today</button>
    <button class="chip" data-chip="week">this week</button>
    <button class="chip" data-chip="month">this month</button>
    <button class="chip" data-chip="biggest">biggest expense</button>
  </div>
  <div id="expList"></div>
</div>

<div class="panel" id="budget">
  <div class="card">
    <div class="form-row">
      <div class="form-group">
        <label>monthly budget</label>
        <input type="number" id="budgetInput" min="0" step="0.01" placeholder="enter amount">
      </div>
      <div class="form-group" style="flex:0 0 auto">
        <label>&nbsp;</label>
        <button class="btn btn-accent" id="budgetSaveBtn">save</button>
      </div>
    </div>
  </div>
  <div id="budgetDisplay"></div>
</div>

<script src="app.js"></script>
</body>
</html>
